schema_version = "1.1"

[task]
name = "akashdex/aws-cli-s3-tier3"
description = "AWS CLI S3 RL env Tier 3 (mb, rb, cp single+recursive, ls, mv, rm, filters)"
authors = [{ name = "Akash Dex", email = "akashdex3@gmail.com" }]
keywords = ["aws", "s3", "cli", "rl-training", "tier-3"]

[metadata]
difficulty = "hard"
difficulty_explanation = "Tier 3 of a 3-tier curriculum. Full 6-command coverage with byte-exact stdout for 5 transfer-type templates, asymmetric path-type detection, include/exclude filter semantics with root-prefixing, URI parser handling 5+ shapes, --human-readable byte boundaries, mv self-move guard. Estimated effort for a frontier model: 20-40 minutes wall-clock."
category = "cli-tool"
tier = "3"

[agent]
timeout_sec = 2400.0
user = "agent"

[verifier]
timeout_sec = 600.0

[environment]
build_timeout_sec = 180.0
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = false

[environment.healthcheck]
command = "/usr/local/bin/moto-check"
interval_sec = 1.0
timeout_sec = 5.0
start_period_sec = 0.5
retries = 10
