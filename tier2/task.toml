schema_version = "1.1"

[task]
name = "akashdex/aws-cli-s3-tier2"
description = "AWS CLI S3 RL env Tier 2 (mb, rb, cp single-file, ls, rm)"
authors = [{ name = "Akash Dex", email = "akashdex3@gmail.com" }]
keywords = ["aws", "s3", "cli", "rl-training", "tier-2"]

[metadata]
difficulty = "medium"
difficulty_explanation = "Tier 2 of a 3-tier curriculum. Implement 5 subcommands (mb/rb/cp-single/ls/rm) with byte-exact stdout for 3 transfer-type templates, exit codes {0,1,2}, and S3-side state invariants. Estimated effort for a frontier model: 15-30 minutes wall-clock."
category = "cli-tool"
tier = "2"

[agent]
timeout_sec = 1800.0
user = "agent"

[verifier]
timeout_sec = 420.0

[environment]
build_timeout_sec = 180.0
os = "linux"
cpus = 4
memory_mb = 4096
storage_mb = 8192
gpus = 0
allow_internet = false

[environment.healthcheck]
command = "/usr/local/bin/moto-check"
interval_sec = 1.0
timeout_sec = 5.0
start_period_sec = 0.5
retries = 10
