schema_version = "1.1"

[task]
name = "akashdex/aws-cli-s3-tier1"
description = "AWS CLI S3 RL env Tier 1 (mb, rb)"
authors = [{ name = "Akash Dex", email = "akashdex3@gmail.com" }]
keywords = ["aws", "s3", "cli", "rl-training", "tier-1"]

[metadata]
difficulty = "easy"
difficulty_explanation = "Tier 1 of a 3-tier curriculum. Implement aws s3 mb and aws s3 rb with byte-exact stdout, correct exit codes, and S3-side state invariants. Estimated effort for a frontier model: 5-15 minutes wall-clock."
category = "cli-tool"
tier = "1"

[agent]
timeout_sec = 900.0
user = "agent"

[verifier]
timeout_sec = 240.0

[environment]
build_timeout_sec = 180.0
os = "linux"
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = false

[environment.healthcheck]
command = "/usr/local/bin/moto-check"
interval_sec = 1.0
timeout_sec = 5.0
start_period_sec = 0.5
retries = 10
